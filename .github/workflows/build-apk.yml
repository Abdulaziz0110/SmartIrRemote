name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q SmartIrRemote.zip -d source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find source -type f -name gradlew -print -quit)")"
          test -n "$PROJECT_DIR" || (echo "gradlew not found" && exit 1)
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
