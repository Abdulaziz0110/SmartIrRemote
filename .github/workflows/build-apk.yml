
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q SmartIrRemote.zip -d source

      - name: Locate Android project
        run: |
          find source -name settings.gradle.kts -o -name settings.gradle
          find source -name gradlew

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find source -type f -name settings.gradle.kts -print -quit)")"
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(dirname "$(find source -type f -name settings.gradle -print -quit)")"
          fi
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
